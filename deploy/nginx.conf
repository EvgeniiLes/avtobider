# Автобидер: nginx. Вместо __DOMAIN__ скрипт install.sh подставит ваш домен.
# HTTPS (сертификат) добавляет certbot после установки.
server {
    # default_server: сайт открывается и по IP-адресу (удобно, пока домен не заработал).
    listen 80 default_server;
    server_name __DOMAIN__;

    # Видео до 100 МБ плюс запас на форму.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
